<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    <Directory /var/www/html/public>
        # Désactive le scan des .htaccess pour plus de performance (tout est ici)
        AllowOverride None
        Require all granted

        <IfModule mod_rewrite.c>
            Options -MultiViews
            RewriteEngine On

            # 1. Transmet l'en-tête Authorization (crucial pour l'API)
            RewriteCond %{HTTP:Authorization} .+
            RewriteRule ^ - [E=HTTP_AUTHORIZATION:%0]

            # 2. Si le fichier ou le dossier existe physiquement, on l'affiche directement
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]

            # 3. Sinon, on redirige tout le reste vers index.php
            RewriteRule ^ index.php [QSA,L]
        </IfModule>

        # Filet de sécurité moderne (si mod_rewrite est désactivé ou échoue)
        FallbackResource /index.php
    </Directory>

    # Optimisation : évite de lancer PHP pour des assets manquants dans /bundles
    <Directory /var/www/html/public/bundles>
        FallbackResource disabled
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>