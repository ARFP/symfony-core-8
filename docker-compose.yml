name: mde-symfony8
services:
  db_api:
    image: mariadb:11.8.5
    container_name: symfony_db
    ports: [3306:3306]
    environment:
      # Le mot de passe root (système)
      MYSQL_ROOT_PASSWORD: rootpassword
      # Création automatique de la base et de l'utilisateur
      MYSQL_DATABASE: symfony_db
      MYSQL_USER: symfony_user
      MYSQL_PASSWORD: symfony_password
    volumes:
      - db_api_data:/var/lib/mysql

  api:
    build: ./symfony
    container_name: symfony_api
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Mise à jour de la chaîne de connexion avec le nouvel utilisateur
      DATABASE_URL: "mysql://symfony_user:symfony_password@db_api:3306/symfony_db?serverVersion=mariadb-10.11.0"

volumes:
  db_api_data: